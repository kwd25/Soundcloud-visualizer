name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + format check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://placeholder@localhost/placeholder
          SOUNDCLOUD_CLIENT_ID: placeholder
          SOUNDCLOUD_CLIENT_SECRET: placeholder
          AUTH_SECRET: placeholder_secret_that_is_at_least_32_chars_long
          ANTHROPIC_API_KEY: placeholder
          SKIP_ENV_VALIDATION: "1"
